name: Build Teatime APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the app screens
        run: npm run build:web

      - name: Copy them into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/Teatime-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Teatime-1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Teatime 1.0.${{ github.run_number }}
          body: Open this page on your Android phone and tap the .apk file below to download and install it.
          files: dist/*.apk
          make_latest: true
